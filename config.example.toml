# Copy to app.toml and adjust for the consuming application.
appName = "MyApp"

[web]
port = 8080
logLevel = "info"
localePath = "./locales"
defaultLang = "zh-CN"

[web.cors]
# Explicit origins only. Do not use "*" with credentials.
allowOrigins = ["http://localhost:3000"]
allowMethods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
allowHeaders = ["Content-Type", "Authorization", "X-Request-ID"]
allowCredentials = false

[web.security]
# Limits declared request bodies before route handlers run.
maxBodySize = 10485760

[web.upload]
maxFileSize = 10485760
allowedExts = [".jpg", ".png", ".pdf"]
uploadPath = "./uploads"
urlPrefix = "/uploads"

